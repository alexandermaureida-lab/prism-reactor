name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build VST3 + AU
        run: cmake --build build --config Release --parallel --target PrismReactor_VST3 PrismReactor_AU PrismReactor_Standalone

      - name: Sign (ad-hoc) and package
        run: |
          OUT=build/PrismReactor_artefacts/Release
          mkdir -p dist/PrismReactor-mac
          cp -R "$OUT/VST3/Prism Reactor.vst3" dist/PrismReactor-mac/
          cp -R "$OUT/AU/Prism Reactor.component" dist/PrismReactor-mac/
          cp -R "$OUT/Standalone/Prism Reactor.app" dist/PrismReactor-mac/
          cat > dist/PrismReactor-mac/INSTALAR.command <<'SH'
          #!/usr/bin/env bash
          cd "$(dirname "$0")"
          mkdir -p ~/Library/Audio/Plug-Ins/VST3 ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/VST3/"Prism Reactor.vst3" ~/Library/Audio/Plug-Ins/Components/"Prism Reactor.component"
          cp -R "Prism Reactor.vst3" ~/Library/Audio/Plug-Ins/VST3/
          cp -R "Prism Reactor.component" ~/Library/Audio/Plug-Ins/Components/
          xattr -cr ~/Library/Audio/Plug-Ins/VST3/"Prism Reactor.vst3" ~/Library/Audio/Plug-Ins/Components/"Prism Reactor.component"
          codesign --force --deep --sign - ~/Library/Audio/Plug-Ins/VST3/"Prism Reactor.vst3"
          codesign --force --deep --sign - ~/Library/Audio/Plug-Ins/Components/"Prism Reactor.component"
          mkdir -p ~/Applications
          rm -rf ~/Applications/"Prism Reactor.app"
          cp -R "Prism Reactor.app" ~/Applications/
          xattr -cr ~/Applications/"Prism Reactor.app"
          codesign --force --deep --sign - ~/Applications/"Prism Reactor.app"
          echo "Instalado. Standalone en ~/Applications. En Ableton Live: Settings > Plug-Ins > Rescan."
          SH
          chmod +x dist/PrismReactor-mac/INSTALAR.command
          codesign --force --deep --sign - "dist/PrismReactor-mac/Prism Reactor.vst3"
          codesign --force --deep --sign - "dist/PrismReactor-mac/Prism Reactor.component"
          codesign --force --deep --sign - "dist/PrismReactor-mac/Prism Reactor.app"
          lipo -archs "dist/PrismReactor-mac/Prism Reactor.vst3/Contents/MacOS/Prism Reactor"
          cd dist && ditto -c -k --keepParent PrismReactor-mac PrismReactor-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PrismReactor-mac
          path: dist/PrismReactor-mac.zip

      - name: Publish release (descarga directa)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mac-latest --cleanup-tag -y || true
          gh release create mac-latest dist/PrismReactor-mac.zip \
            --title "Prism Reactor para Mac (VST3 + AU + Standalone)" \
            --notes "Universal (Apple Silicon + Intel). Descomprime y ejecuta INSTALAR.command; luego Rescan en Ableton Live."

  other:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --target PrismReactor_VST3 --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: PrismReactor-${{ runner.os }}
          path: build/PrismReactor_artefacts/Release/VST3/
